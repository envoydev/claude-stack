schema_version: "1.1"
name: skill-devops
description: A CI workflow request loads the devops library skill (the devops stack).
tags: [library, skill, devops]
execution:
  prompt: |
    Write a GitHub Actions workflow that builds and tests a .NET 9 solution on push and pull request,
    with NuGet caching. Reply with the YAML in one code block.
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: loads-devops
    tool: Skill
    input_match: devops
    min: 1
    arm: both
