schema_version: "1.1"
name: skill-dotnet-web-backend
description: An ASP.NET Core endpoint request loads the dotnet-web-backend library skill (the aspnet stack).
tags: [library, skill, aspnet]
execution:
  prompt: |
    Add a minimal-API endpoint GET /orders/{id} to an ASP.NET Core 9 service that returns 404 when the
    order is missing. Reply with the Program.cs changes in one code block.
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: loads-dotnet-web-backend
    tool: Skill
    input_match: dotnet-web-backend
    min: 1
    arm: both
