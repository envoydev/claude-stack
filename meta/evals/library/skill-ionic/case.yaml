schema_version: "1.1"
name: skill-ionic
description: An Ionic Angular page request loads the ionic library skill (the ionic-angular stack).
tags: [library, skill, ionic-angular]
execution:
  prompt: |
    Write an Ionic Angular page that lists notes with pull-to-refresh and a floating add button. Reply
    with the component TypeScript and template in one code block each.
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: loads-ionic
    tool: Skill
    input_match: ionic
    min: 1
    arm: both
