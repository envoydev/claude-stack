schema_version: "1.1"
name: skill-database-conventions
description: A SQL Server schema request loads the database-conventions library skill (the data stack).
tags: [library, skill, data]
execution:
  prompt: |
    Design the SQL Server tables for customers, orders and order lines with keys, indexes and audit
    columns. Reply with the DDL in one code block.
  max_turns: 6
  allowed_tools: [Read, Glob, Grep, Skill]
runs: 3
graders:
  - type: tool_used
    name: loads-database-conventions
    tool: Skill
    input_match: database-conventions
    min: 1
    arm: both
